    <!-- Critical CSS. Runs before tokens.css exists, so these few values are literals that mirror
         --carbon-0 #06070d, --carbon-1 #0b0d15, --void #03040a, --ink #f4f6fb, --ink-2 #aab2c6, --ignite-*, --ease-in, --t-base. -->
    <style id="boot-css">
      html { background: #06070d; color-scheme: dark; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
      body { margin: 0; background: #06070d; color: #f4f6fb; min-height: 100vh; min-height: 100dvh; }
      #boot {
        position: fixed; inset: 0; z-index: 200; display: grid; place-items: center;
        background: radial-gradient(120% 78% at 50% 42%, #0b0d15 0%, #06070d 56%, #03040a 100%);
      }
      #boot.boot--out { opacity: 0; transition: opacity 240ms cubic-bezier(.7, 0, .84, 0); pointer-events: none; }
      /* Same size and place as the iOS launch image (public/splash): the mark does not jump when the splash hands over. */
      .boot-art { position: absolute; left: 50%; top: 43.4%; width: clamp(128px, 36vw, 188px); aspect-ratio: 356 / 408; transform: translate(-50%, -50%); }
      .boot-mark { position: relative; display: block; width: 100%; height: 100%; overflow: visible; filter: drop-shadow(0 18px 26px rgba(0, 0, 0, .65)); }
      .boot-aura { position: absolute; inset: -42%; background: radial-gradient(closest-side, rgba(255, 112, 32, .2), rgba(255, 112, 32, .06) 55%, rgba(255, 112, 32, 0) 78%); }
      @keyframes boot-breathe { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }
      @media (prefers-reduced-motion: no-preference) { .boot-aura { animation: boot-breathe 2.6s ease-in-out infinite; } }
      .boot-stall {
        display: none; position: absolute; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom, 0px) + 44px);
        flex-direction: column; align-items: center; gap: 14px; padding: 0 28px; text-align: center;
        font: 400 15px/1.45 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; color: #aab2c6;
      }
      #boot[data-stalled] .boot-stall { display: flex; }
      .boot-stall button { font: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
      .boot-go {
        min-width: 160px; min-height: 48px; padding: 0 28px; border: 0; color: #1a0900;
        font: 700 16px/1 'Barlow Condensed', 'Arial Narrow', system-ui, sans-serif; letter-spacing: .14em; text-transform: uppercase;
        background: linear-gradient(135deg, #ff4a0f 0%, #ff8a1c 56%, #ffc43d 100%);
        clip-path: polygon(14px 0, 100% 0, 100% calc(100% - 14px), calc(100% - 14px) 100%, 0 100%, 0 14px);
      }
      .boot-reset { background: none; border: 0; padding: 8px 12px; color: #7a8299; font-size: 13px; line-height: 1.4; }
      .boot-reset small { display: block; font-size: 12px; color: #4b5268; }
      .boot-note { margin: 0; max-width: 28ch; }
      .boot-nojs { position: fixed; inset: 0; z-index: 210; display: grid; place-items: center; padding: 28px; text-align: center; background: #06070d; font: 17px/1.5 system-ui, sans-serif; color: #aab2c6; }
    </style>

    <script>
      (function () {
        var d = document.documentElement, boot = document.getElementById('boot')
        var standalone = (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true
        d.setAttribute('data-display', standalone ? 'standalone' : 'browser')
        function stall() { if (boot && boot.parentNode && !boot.getAttribute('data-dead')) boot.setAttribute('data-stalled', '1') }
        setTimeout(stall, 9000)
        window.addEventListener('error', function (e) { var n = e.target && e.target.tagName; if (n === 'SCRIPT' || n === 'LINK') stall() }, true)
        function gone() { if (boot.parentNode) boot.parentNode.removeChild(boot) }
        function out() {
          if (!boot || !boot.parentNode || boot.getAttribute('data-dead')) return
          boot.setAttribute('data-dead', '1')
          var calm = d.getAttribute('data-fx') === 'lite' || (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches)
          requestAnimationFrame(function () { requestAnimationFrame(function () {
            if (calm) return gone()
            boot.className = 'boot--out'; setTimeout(gone, 260)
          }) })
        }
        window.__kindBootOut = out
        var root = document.getElementById('root')
        if (window.MutationObserver) new MutationObserver(function (_, o) { if (root.firstElementChild) { o.disconnect(); out() } }).observe(root, { childList: true })
        document.getElementById('boot-reload').onclick = function () { location.reload() }
        document.getElementById('boot-reset').onclick = function () {
          var jobs = []
          if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister() })) }))
          if (window.caches) jobs.push(caches.keys().then(function (ks) { return Promise.all(ks.filter(function (k) { return k.indexOf('kind-') === 0 }).map(function (k) { return caches.delete(k) })) }))
          Promise.all(jobs).then(function () { location.reload() }, function () { location.reload() })
        }
      })()
