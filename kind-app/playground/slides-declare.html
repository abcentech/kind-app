<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>slides-declare</title>
    <style>
      /* stand-in for the lesson shell: header, scrolling .lesson-slide with a fade mask, footer */
      .pg-lesson { position: absolute; inset: 0; display: flex; flex-direction: column; background: var(--carbon-0); }
      .pg-head { flex: none; height: 56px; display: flex; align-items: center; gap: 12px; padding: 0 20px; font: 500 11px var(--font-mono); color: var(--ink-3); letter-spacing: .04em; }
      .pg-head i { flex: 1; height: 3px; border-radius: 2px; background: var(--ignite-flat); opacity: .8; }
      .lesson-slide { flex: 1 1 0; min-height: 0; display: flex; flex-direction: column; overflow-y: auto; padding: 0 var(--gutter);
        -webkit-mask-image: linear-gradient(180deg, transparent 0, #000 16px, #000 calc(100% - 8px), transparent 100%);
        mask-image: linear-gradient(180deg, transparent 0, #000 16px, #000 calc(100% - 8px), transparent 100%); scrollbar-width: none; }
      .lesson-slide::-webkit-scrollbar { display: none; }
      .pg-foot { flex: none; padding: 12px var(--gutter) 20px; }
      .pg-foot button { width: 100%; height: 56px; border: 0; font: 600 18px var(--font-display); letter-spacing: .14em; text-transform: uppercase; color: var(--ink-on-ignite); background: var(--ignite); clip-path: var(--clip-cut); cursor: pointer; }
      .pg-foot button:disabled { background: var(--carbon-3); color: var(--ink-3); cursor: default; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./slides-declare.jsx"></script>
  </body>
</html>
