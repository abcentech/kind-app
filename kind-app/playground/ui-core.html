<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>ui-core · specimen</title>
    <link rel="icon" href="data:," />
    <style>
      /* playground chrome only — the components under test bring their own styles */
      html, body { margin: 0; background: var(--carbon-0); color: var(--ink); font-family: var(--font-ui, system-ui); -webkit-font-smoothing: antialiased; }
      body { min-height: 100vh; }
      *, *::before, *::after { box-sizing: border-box; }
      .pg { max-width: 1180px; margin: 0 auto; padding: var(--s-5, 20px) var(--s-4, 16px) var(--s-20, 80px); }
      .pg-head { display: flex; flex-direction: column; gap: var(--s-3, 12px); padding: var(--s-4, 16px) 0 var(--s-6, 24px); }
      .pg-title { margin: 0; font: 600 var(--fs-3xl, 2.75rem)/.95 var(--font-display); letter-spacing: var(--track-label); text-transform: uppercase; }
      .pg-title b { color: var(--ignite-2); font-weight: 600; }
      .pg-meta { margin: 0; color: var(--ink-3); font: 500 var(--fs-2xs, .6875rem)/1.5 var(--font-mono); letter-spacing: var(--track-mono); text-transform: uppercase; }
      .pg-grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--s-10, 40px) var(--s-8, 32px); align-items: start; }
      @media (min-width: 900px) { .pg-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } .pg-wide { grid-column: 1 / -1; } }
      .pg-sec { display: flex; flex-direction: column; gap: var(--s-4, 16px); min-width: 0; }
      .pg-sec > h2 { display: flex; align-items: baseline; gap: var(--s-3, 12px); margin: 0; padding-bottom: var(--s-2, 8px); border-bottom: 1px solid var(--line-2); font: 600 var(--fs-lg, 1.25rem)/1 var(--font-display); letter-spacing: var(--track-label); text-transform: uppercase; }
      .pg-sec > h2 small { color: var(--ink-3); font: 500 var(--fs-2xs, .6875rem)/1 var(--font-mono); letter-spacing: var(--track-mono); }
      .pg-row { display: flex; flex-wrap: wrap; align-items: center; gap: var(--s-3, 12px) var(--s-4, 16px); }
      .pg-cells { display: grid; grid-template-columns: repeat(auto-fill, minmax(148px, 1fr)); gap: var(--s-5, 20px) var(--s-4, 16px); align-items: start; }
      .pg-cell { display: flex; flex-direction: column; align-items: flex-start; gap: var(--s-2, 8px); min-width: 0; }
      .pg-cell > .pg-cap { color: var(--ink-4); font: 500 var(--fs-2xs, .6875rem)/1 var(--font-mono); letter-spacing: var(--track-mono); text-transform: uppercase; }
      .pg-cap { color: var(--ink-3); font: 500 var(--fs-2xs, .6875rem)/1 var(--font-mono); letter-spacing: var(--track-mono); text-transform: uppercase; }
      .pg-stack { display: flex; flex-direction: column; gap: var(--s-4, 16px); }
      .pg-stage { position: relative; padding: var(--s-6) var(--s-5); border-radius: var(--r-md); overflow: hidden; background:
        radial-gradient(1px 1px at 12% 22%, color-mix(in srgb, var(--ink) 70%, transparent), transparent 60%), radial-gradient(1px 1px at 78% 16%, color-mix(in srgb, var(--ink) 50%, transparent), transparent 60%),
        radial-gradient(1.5px 1.5px at 54% 70%, color-mix(in srgb, var(--ink) 55%, transparent), transparent 60%), radial-gradient(1px 1px at 90% 82%, color-mix(in srgb, var(--ink) 60%, transparent), transparent 60%),
        linear-gradient(160deg, color-mix(in srgb, var(--tele-2) 24%, var(--carbon-0)), var(--carbon-0) 58%, color-mix(in srgb, var(--stage-3) 16%, var(--carbon-0))); }
      .pg-surface { padding: var(--s-5, 20px); border-radius: var(--r-md, 18px); background: var(--carbon-0); box-shadow: inset 0 0 0 1px var(--line); }
      .pg-lite-on [data-fx-note] { color: var(--ignite-2); }
      /* in-situ compositions: the primitives under real usage — launch bar, answer plates, HUD */
      .pg-bar { display: flex; flex-direction: column; gap: var(--s-3); max-width: 420px; margin-top: var(--s-16); }
      .pg-bar-top, .pg-bar-meta { display: flex; align-items: center; justify-content: space-between; gap: var(--s-3); }
      .pg-bar-title { font: 500 var(--fs-xl)/1.15 var(--font-serif); letter-spacing: -.01em; text-wrap: balance; }
      .pg-plate { display: flex; align-items: center; gap: var(--s-4); min-height: calc(var(--tap) + var(--s-4)); font: 500 var(--fs-base)/1.3 var(--font-ui); letter-spacing: -.011em; }
      .pg-plate > span { flex: 1; min-width: 0; }
      .pg-verdict { display: flex; align-items: center; gap: var(--s-3); min-height: var(--s-6); }
      .pg-hud { display: flex; align-items: center; gap: var(--s-4); }
      .pg-hud > .k-stat { flex: 1; }

    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./ui-core.jsx"></script>
  </body>
</html>
