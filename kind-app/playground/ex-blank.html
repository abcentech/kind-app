<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>ex-blank-order · specimen</title>
    <link rel="icon" href="data:," />
    <style>
      /* playground chrome only: the exercises bring their own styles */
      html, body { margin: 0; background: var(--carbon-0); color: var(--ink); font-family: var(--font-ui, system-ui); -webkit-font-smoothing: antialiased; }
      *, *::before, *::after { box-sizing: border-box; }
      .pg-demo { display: flex; flex-direction: column; gap: var(--s-4); padding: var(--s-6) var(--gutter) var(--s-5); border-bottom: 1px solid var(--line-2); }
      .pg-meta { display: flex; justify-content: space-between; gap: var(--s-3); margin: 0; color: var(--ink-4); font: 500 var(--fs-2xs)/1.4 var(--font-mono); letter-spacing: var(--track-mono); text-transform: uppercase; }
      .pg-meta b { color: var(--tele); font-weight: 500; }
      .pg-bar { display: flex; gap: var(--s-3); align-items: center; }
      .pg-bar > :first-child { flex: 1; }
      .pg-title { margin: 0; padding: var(--s-6) var(--gutter) 0; font: 600 var(--fs-2xl)/1 var(--font-display); letter-spacing: var(--track-label); text-transform: uppercase; }
      .pg-title b { color: var(--ignite-2); font-weight: 600; }
      .pg-note { margin: 0; padding: var(--s-2) var(--gutter) 0; color: var(--ink-3); font: 500 var(--fs-2xs)/1.5 var(--font-mono); letter-spacing: var(--track-mono); text-transform: uppercase; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./ex-blank.jsx"></script>
  </body>
