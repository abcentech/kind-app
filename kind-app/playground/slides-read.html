<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>slides-read · specimen</title>
    <style>
      /* The shell's .lesson-slide does not exist until lesson-shell lands: a fallback in the lowest layer, so the real rule (layer: screen) always wins. */
      @layer reset {
        .lesson-slide {
          flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column;
          overflow-y: auto; overflow-x: hidden;
          padding: var(--s-6) var(--gutter) calc(var(--s-20) + var(--s-12));
          -webkit-mask-image: linear-gradient(to bottom, transparent 0, var(--void) var(--s-6), var(--void) calc(100% - var(--s-20)), transparent 100%);
                  mask-image: linear-gradient(to bottom, transparent 0, var(--void) var(--s-6), var(--void) calc(100% - var(--s-20)), transparent 100%);
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./slides-read.jsx"></script>
  </body>
</html>
