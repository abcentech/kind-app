<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>ex-match · bench</title>
    <link rel="icon" href="data:," />
    <style>
      /* playground chrome only — the Match renderer brings its own styles */
      html, body { margin: 0; background: var(--carbon-0); color: var(--ink); font-family: var(--font-ui); -webkit-font-smoothing: antialiased; }
      *, *::before, *::after { box-sizing: border-box; }
      .pgm { padding: var(--s-4) var(--gutter) var(--s-8); display: flex; flex-direction: column; gap: var(--s-4); }
      .pgm-bar { display: flex; flex-wrap: wrap; gap: var(--s-2); align-items: center; }
      .pgm-bar select { flex: 1 1 8rem; min-width: 0; height: var(--s-10); padding: 0 var(--s-3); border: 1px solid var(--line-2); background: var(--carbon-2); color: var(--ink-2); font: 500 var(--fs-xs) var(--font-mono); }
      .pgm-eyebrow { display: flex; justify-content: space-between; gap: var(--s-3); color: var(--ink-3); font: 500 var(--fs-2xs)/1.4 var(--font-mono); letter-spacing: var(--track-mono); text-transform: uppercase; }
      .pgm-prompt { margin: 0; font: 500 var(--fs-xl)/1.2 var(--font-serif); text-wrap: balance; }
      .pgm-foot { display: flex; gap: var(--s-3); }
      .pgm-foot > * { flex: 1; }
      .pgm-ans { margin: 0; color: var(--ink-3); font: 500 var(--fs-xs)/1.4 var(--font-mono); }
      .pgm-sheet { display: flex; flex-wrap: wrap; gap: var(--s-8); padding: var(--s-6); align-items: flex-start; }
      .pgm-cell { width: var(--cell-w, 360px); border: 1px dashed var(--line-2); padding: var(--s-4) var(--gutter) var(--s-6); display: flex; flex-direction: column; gap: var(--s-4); }
      .pgm-cap { color: var(--ignite-2); font: 600 var(--fs-xs)/1 var(--font-mono); letter-spacing: var(--track-mono); text-transform: uppercase; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./ex-match.jsx"></script>
  </body>
</html>
